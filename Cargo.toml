[package]
name = "vega-web"
version = "5.1.23"
edition = "2024"
license = "GPL-3.0"
authors = ["Rodrigo Brito"]
rust-version = "1.92"
homepage = "https://github.com/lyra-os-linux/vega-web"
description = "Interface web HTTPS (somente LAN) do centro de controle Vega"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dependencies]
lyra-vega-dbus = { git = "https://github.com/lyra-os-linux/lyra-vega-dbus", rev = "5d559f9f1f95916a33befe23af6da6084012e000" }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "process"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-private"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
rcgen = "0.14.8"
rand = "0.10.2"
time = { version = "0.3.55", features = ["formatting"] }
libc = "0.2.189"
serde = { version = "1.0.228", features = ["derive"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
zeroize = { version = "1.9.0", features = ["std"] }
zbus = "5.19.0"

[dev-dependencies]
futures-util = { version = "0.3.34", features = ["sink"] }
tokio-tungstenite = "0.29.0"
tempfile = "3.27.0"
