name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Install session integration and disposable VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gettext libpam0g-dev qemu-system-x86 cpio linux-image-virtual
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - name: Test authentication and terminal contracts
        run: |
          cargo test --locked
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Verify logout and expiry with live HTTP and WebSocket connections
        run: bash scripts/check-session-contracts.sh
      - name: Qualify the real terminal helper in a disposable systemd VM
        run: |
          cargo build --locked --bin vega-web-terminal-helper
          vm_kernel="$(find /boot -maxdepth 1 -name 'vmlinuz-*' | sort -V | tail -n 1)"
          test -n "$vm_kernel"
          sudo install -m 0644 "$vm_kernel" "$RUNNER_TEMP/vega-terminal-kernel"
          python3 scripts/check-terminal-helper-vm.py --kernel "$RUNNER_TEMP/vega-terminal-kernel"
      - name: Verify canonical D-Bus contract pin
        run: |
          grep -F 'lyra-vega-dbus = { git = "https://github.com/lyra-os-linux/lyra-vega-dbus", tag = "v5.1.22" }' Cargo.toml
          grep -F 'lyra-vega-dbus?tag=v5.1.22#' Cargo.lock

  packaging:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - name: Install packaging validators
        run: zypper --non-interactive install git rpm-build systemd-rpm-macros sysuser-tools
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse RPM specs with openSUSE macros
        run: |
          cmp packaging/vega-web.sysusers packaging/sysusers.d/vega-web.conf
          rpmspec -P packaging/vega-web.spec >/dev/null
          rpmspec -P packaging/vega-web.obs.spec >/dev/null
