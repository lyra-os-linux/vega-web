name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Install session integration and disposable VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gettext libpam0g-dev libpam-modules libpam-runtime qemu-system-x86 cpio linux-image-virtual iproute2 passwd openssl polkitd firewalld nftables python3-dbus python3-gi python3-nftables python3-decorator rpm zypper libsolv-tools kmod
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - name: Test authentication and terminal contracts
        run: |
          cargo test --locked
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Verify logout and expiry with live HTTP and WebSocket connections
        run: bash scripts/check-session-contracts.sh
      - name: Reject web mutations even when a fake daemon would allow them
        run: bash scripts/check-authorization-contracts.sh
      - name: Qualify the real terminal helper in a disposable systemd VM
        run: |
          cargo build --locked --bin vega-web-terminal-helper
          vm_kernel="$(find /boot -maxdepth 1 -name 'vmlinuz-*' | sort -V | tail -n 1)"
          test -n "$vm_kernel"
          sudo install -m 0644 "$vm_kernel" "$RUNNER_TEMP/vega-terminal-kernel"
          basename "$vm_kernel" | sed 's/^vmlinuz-//' > "$RUNNER_TEMP/vega-terminal-kernel.version"
          python3 scripts/check-terminal-helper-vm.py --kernel "$RUNNER_TEMP/vega-terminal-kernel"
      - name: Qualify PAM isolation and real HTTPS login in a disposable systemd VM
        run: |
          cargo build --locked --bins
          if readelf -d target/debug/vega-web | grep -q libpam; then
            echo 'HTTPS binary must not link libpam' >&2
            exit 1
          fi
          readelf -d target/debug/vega-web-auth-helper | grep libpam
          sh -n packaging/migrate-auth.sh
          bash -n scripts/dev-install.sh scripts/dev-uninstall.sh
          python3 scripts/check-auth-helper-vm.py --kernel "$RUNNER_TEMP/vega-terminal-kernel"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lyra-os-linux/vegad
          ref: 6daccd0b181777764e549373b2bdd06cd2189372
          path: target/vegad-contract-source
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: target/vegad-contract-source/go.mod
          cache-dependency-path: target/vegad-contract-source/go.sum
      - name: Build pinned daemon for native administrative qualification
        working-directory: target/vegad-contract-source
        run: go build -o ../vegad-contract-check ./cmd/vegad
      - name: Qualify per-user PAM and Polkit with real RPM and firewall transactions
        run: |
          vm_version="$(cat "$RUNNER_TEMP/vega-terminal-kernel.version")"
          /usr/bin/python3 scripts/check-admin-helper-vm.py \
            --kernel "$RUNNER_TEMP/vega-terminal-kernel" \
            --modules-dir "/lib/modules/$vm_version" \
            --vegad target/vegad-contract-check \
            --policy target/vegad-contract-source/packaging/org.lyraos.vega.policy
      - name: Verify canonical D-Bus contract pin
        run: |
          bash scripts/check-dbus-pin.sh

  packaging:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - name: Install packaging validators
        run: zypper --non-interactive install git rpm-build systemd-rpm-macros sysuser-tools
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse RPM specs with openSUSE macros
        run: |
          cmp packaging/vega-web.sysusers packaging/sysusers.d/vega-web.conf
          rpmspec -P packaging/vega-web.spec >/dev/null
          rpmspec -P packaging/vega-web.obs.spec >/dev/null
